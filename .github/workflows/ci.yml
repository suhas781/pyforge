name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Tests, types, and package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Tests
        run: pytest --cov=pyforge --cov-report=term-missing

      - name: Build package
        run: python -m build

      - name: Validate distribution artifacts
        run: python scripts/check_distribution.py

      - name: Install the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/from-wheel"
          "$RUNNER_TEMP/from-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/from-wheel/bin/python" -c "import json, logging; from pyforge import JsonFormatter, RetryPolicy, get_env_bool, get_env_int, retry; record = logging.LogRecord('t', logging.INFO, 'x', 1, 'ok', (), None); assert json.loads(JsonFormatter().format(record))['message'] == 'ok'; assert RetryPolicy().delay_for(1) == 0.25; assert callable(retry); assert get_env_int('PYFORGE_DISTRIBUTION_CHECK_PORT', default=8000, minimum=1, maximum=65535) == 8000; assert get_env_bool('PYFORGE_DISTRIBUTION_CHECK_DEBUG', default=False) is False; from pyforge import should_retry_http; assert should_retry_http('GET', status_code=503) is True; assert should_retry_http('POST', status_code=503) is False; from pyforge import RetryEvent, RetryEventType; sample = RetryEvent(RetryEventType.EXHAUSTED, 1, 1, exception_type='TimeoutError'); assert sample.event_type is RetryEventType.EXHAUSTED; assert sample.exception_type == 'TimeoutError'; assert sample.delay is None; from pyforge import MemoryCache; cache = MemoryCache(1, clock=lambda: 0.0); cache.set('k', None); assert cache.get('k') is None; assert 'missing' not in cache"

      - name: Install the sdist in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/from-sdist"
          "$RUNNER_TEMP/from-sdist/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/from-sdist/bin/python" -c "from pyforge import JsonFormatter, RetryPolicy, get_env; assert RetryPolicy().max_attempts == 3; assert callable(JsonFormatter); assert get_env('PYFORGE_DISTRIBUTION_CHECK_URL') is None; from pyforge import is_idempotent_method; assert is_idempotent_method('PUT') is True; assert is_idempotent_method('PATCH') is False; from pyforge import RetryEventType; assert RetryEventType.SCHEDULED.value == 'scheduled'; from pyforge import MemoryCache; assert MemoryCache(2).max_entries == 2"
